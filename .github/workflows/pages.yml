name: Deploy Playground

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure wasm build
        run: emcmake cmake -S . -B build/wasm -DDHAD_BUILD_WASM=ON

      - name: Build wasm artifacts
        run: cmake --build build/wasm -j4

      - name: Assemble Pages site
        run: |
          rm -rf site
          mkdir -p site/build
          cp -r web/* site/
          cp build/dhad_web.js site/build/dhad_web.js
          cp build/dhad_web.wasm site/build/dhad_web.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
