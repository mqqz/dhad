name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - os: macos-13
            target: macos-x86_64
            archive: tar.gz
          - os: macos-14
            target: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang llvm-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          choco install ninja --no-progress -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LLVM_DIR=C:\Program Files\LLVM\lib\cmake\llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build dhad
        run: cmake --build build --target dhad

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/dhad-${{ matrix.target }}
          cp build/dhad dist/dhad-${{ matrix.target }}/
          cp LICENSE dist/dhad-${{ matrix.target }}/
          cp README.md dist/dhad-${{ matrix.target }}/
          tar -C dist -czf dhad-${{ matrix.target }}.tar.gz dhad-${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/dhad-${{ matrix.target }} -Force | Out-Null
          Copy-Item build/dhad.exe dist/dhad-${{ matrix.target }}/
          Copy-Item LICENSE dist/dhad-${{ matrix.target }}/
          Copy-Item README.md dist/dhad-${{ matrix.target }}/
          Compress-Archive -Path dist/dhad-${{ matrix.target }} -DestinationPath dhad-${{ matrix.target }}.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhad-${{ matrix.target }}
          path: dhad-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Publish GitHub Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
