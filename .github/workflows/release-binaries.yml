name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
            generator: Unix Makefiles
            codegen: "ON"
          - os: macos-15-intel
            architecture: x86_64
            target: macos-x86_64
            archive: tar.gz
            generator: Unix Makefiles
            codegen: "ON"
          - os: macos-15
            architecture: arm64
            target: macos-arm64
            archive: tar.gz
            generator: Unix Makefiles
            codegen: "ON"
          - os: windows-latest
            target: windows-x86_64
            archive: zip
            generator: NMake Makefiles
            codegen: "OFF"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev
          echo "LLVM_DIR=$(llvm-config --cmakedir)" >> "$GITHUB_ENV"
          echo "$(llvm-config --bindir)" >> "$GITHUB_PATH"
          echo "CC=$(llvm-config --bindir)/clang" >> "$GITHUB_ENV"
          echo "CXX=$(llvm-config --bindir)/clang++" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Print build configuration
        shell: bash
        run: |
          echo "Generator: ${{ matrix.generator }}"
          echo "LLVM_DIR: ${LLVM_DIR:-<unset>}"

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DDHAD_ENABLE_CODEGEN=ON \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture }}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DDHAD_ENABLE_CODEGEN=OFF -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build compiler and tests
        run: cmake --build build --parallel

      - name: Build codegen test driver
        if: matrix.codegen == 'ON'
        run: cmake --build build --target codegen_ex1 --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify binary and example (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            test "$(lipo -archs build/dhad)" = "${{ matrix.architecture }}"
          else
            file build/dhad | grep -q 'x86-64'
          fi
          ./build/dhad examples/hello-world.dh -o build/hello-smoke
          test "$(./build/hello-smoke)" = 'مرحبا يا عالم'

      - name: Verify binary and example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = [System.IO.File]::ReadAllBytes("$pwd/build/dhad.exe")
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          if ([BitConverter]::ToUInt16($binary, $peOffset + 4) -ne 0x8664) {
            throw "Expected an x86_64 PE executable"
          }
          $output = & ./build/dhad.exe examples/hello-world.dh
          if ($LASTEXITCODE -ne 0 -or $output -ne 'مرحبا يا عالم') {
            throw "Interpreter hello-world smoke test failed"
          }

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/dhad-${{ matrix.target }}
          cp build/dhad dist/dhad-${{ matrix.target }}/
          cp LICENSE dist/dhad-${{ matrix.target }}/
          cp README.md dist/dhad-${{ matrix.target }}/
          cp -r examples dist/dhad-${{ matrix.target }}/
          tar -C dist -czf dhad-${{ matrix.target }}.tar.gz dhad-${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/dhad-${{ matrix.target }} -Force | Out-Null
          Copy-Item build/dhad.exe dist/dhad-${{ matrix.target }}/
          Copy-Item LICENSE dist/dhad-${{ matrix.target }}/
          Copy-Item README.md dist/dhad-${{ matrix.target }}/
          Copy-Item examples dist/dhad-${{ matrix.target }}/ -Recurse
          Compress-Archive -Path dist/dhad-${{ matrix.target }} -DestinationPath dhad-${{ matrix.target }}.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhad-${{ matrix.target }}
          path: dhad-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Publish GitHub Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
