name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
            generator: Unix Makefiles
          - os: macos-13
            target: macos-x86_64
            archive: tar.gz
            generator: Unix Makefiles
          - os: macos-14
            target: macos-arm64
            archive: tar.gz
            generator: Unix Makefiles
          - os: windows-latest
            target: windows-x86_64
            archive: zip
            generator: NMake Makefiles

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $resolvedLLVMDir = $null
          $llvmConfigExe = "C:\Program Files\LLVM\bin\llvm-config.exe"
          if (Test-Path $llvmConfigExe) {
            $llvmCmakeDir = & $llvmConfigExe --cmakedir
            if ($LASTEXITCODE -eq 0 -and $llvmCmakeDir) {
              $resolvedLLVMDir = $llvmCmakeDir
            }
          }
          if (-not $resolvedLLVMDir) {
            $llvmConfig = Get-ChildItem -Path "C:\Program Files\LLVM" -Filter LLVMConfig.cmake -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $llvmConfig) {
              throw "LLVMConfig.cmake not found under C:\Program Files\LLVM"
            }
            $resolvedLLVMDir = $llvmConfig.Directory.FullName
          }
          "LLVM_DIR=$resolvedLLVMDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Print build configuration
        shell: bash
        run: |
          echo "Generator: ${{ matrix.generator }}"
          echo "LLVM_DIR: ${LLVM_DIR:-<unset>}"

      - name: Configure
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build dhad
        run: cmake --build build --target dhad --parallel

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/dhad-${{ matrix.target }}
          cp build/dhad dist/dhad-${{ matrix.target }}/
          cp LICENSE dist/dhad-${{ matrix.target }}/
          cp README.md dist/dhad-${{ matrix.target }}/
          tar -C dist -czf dhad-${{ matrix.target }}.tar.gz dhad-${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/dhad-${{ matrix.target }} -Force | Out-Null
          Copy-Item build/dhad.exe dist/dhad-${{ matrix.target }}/
          Copy-Item LICENSE dist/dhad-${{ matrix.target }}/
          Copy-Item README.md dist/dhad-${{ matrix.target }}/
          Compress-Archive -Path dist/dhad-${{ matrix.target }} -DestinationPath dhad-${{ matrix.target }}.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhad-${{ matrix.target }}
          path: dhad-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Publish GitHub Release Assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
